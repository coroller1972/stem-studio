[package]
name = "stem-studio"
version = "0.1.0"
description = "A synchronized four-stem audio workstation"
authors = ["Stem Studio contributors"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "stem_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync"] }
uuid = { version = "1", features = ["v4"] }

